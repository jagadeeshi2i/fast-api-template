[loggers]
keys=root,fastapi,uvicorn

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=genericFormatter

### LOGGERS ###

[logger_root]
level=INFO
handlers=consoleHandler

[logger_fastapi]
level=INFO
handlers=consoleHandler,fileHandler
qualname=fastapi
propagate=0

[logger_uvicorn]
level=INFO
handlers=consoleHandler,fileHandler
qualname=uvicorn
propagate=0

### HANDLERS ###

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=genericFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=genericFormatter
# File name, max bytes (10MB), backup count (keep 5 old logs)
args=('app.log', 'a', 10485760, 5)

### FORMATTERS ###

[formatter_genericFormatter]
format=%(asctime)s - %(levelname)s - [%(name)s] - %(message)s
datefmt=%Y-%m-%d %H:%M:%S